# Perses datasource for logs (Loki). "Global" means every project can use it. The proxy block makes
# the Perses SERVER call the backend by Docker service name, so your browser never needs to
# reach it directly. (One resource per file: Perses ignores everything after a "---".)
kind: GlobalDatasource
metadata:
  name: loki
spec:
  default: true
  plugin:
    kind: LokiDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: http://loki:3100
