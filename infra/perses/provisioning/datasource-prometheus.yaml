# Perses datasource for metrics (Prometheus). "Global" means every project can use it. The proxy block makes
# the Perses SERVER call the backend by Docker service name, so your browser never needs to
# reach it directly. (One resource per file: Perses ignores everything after a "---".)
kind: GlobalDatasource
metadata:
  name: prometheus
spec:
  default: true
  plugin:
    kind: PrometheusDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: http://prometheus:9090
